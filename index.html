  <style>
    :root { --page: #131B36; --ink: #F7F8FF; --rail: #243159; --accent: #52E6C7; }
    :root[data-theme="light"] { --page: #F4F6FC; --ink: #131A35; --rail: #DDE2F3; --accent: #0A7A69; }
    html, body { margin: 0; height: 100%; background: var(--page); }
    #splash {
      position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: var(--page); color: var(--ink);
      font: 600 22px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity .35s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash i { width: 120px; height: 2px; background: var(--rail); overflow: hidden; }
    #splash i::after {
      content: ""; display: block; width: 40%; height: 100%; background: var(--accent);
      animation: load 1.1s ease-in-out infinite;
    }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash i::after { animation: none; width: 100%; } }
    noscript { position: fixed; inset: 0; z-index: 2; overflow: auto; background: var(--page); color: var(--ink); font: 17px/1.6 system-ui, sans-serif; }
    noscript main { max-width: 640px; margin: 0 auto; padding: 48px 24px; }
    noscript a { color: var(--accent); }
  </style>
